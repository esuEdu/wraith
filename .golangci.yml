version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - gosec # weak crypto, file modes, exec with variables (S1, S4)
    - bodyclose
    - errorlint
    - misspell
  exclusions:
    paths:
      - spike/ # throwaway M0 code, deleted after M0
    rules:
      - path: _test\.go
        # deferred Close/Fprintf; fixtures that look like credentials; temp-dir file reads;
        # helpers that close bodies the linter cannot see through
        linters: [errcheck, gosec, bodyclose]

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - spike/
