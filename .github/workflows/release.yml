name: release

# A tag vX.Y.Z (or vX.Y.Z-rc.N) on main releases wraith:
#   1. the same checks as ci.yml, on the tagged commit;
#   2. a GitHub release with notes grouped by commit type, the source tarball, its
#      SHA-256 in checksums.txt and a build provenance attestation (S6.5).
# -rc tags make pre-releases, which the Homebrew tap ignores. The tap updates itself
# from the latest release (esuEdu/homebrew-tap), so this workflow holds no secret.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - run: make fmt-check vet forbidden rules-check test build-universal
      - run: lipo -info dist/wraith && ./dist/wraith version
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
      - name: Source tarball and checksum
        run: |
          curl -fsSL -o "wraith-$TAG.tar.gz" "https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$TAG.tar.gz"
          sha256sum "wraith-$TAG.tar.gz" > checksums.txt
          cat checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: wraith-${{ github.ref_name }}.tar.gz
      - name: Release notes
        run: scripts/release-notes.sh "$TAG" > notes.md && cat notes.md
      - name: GitHub release
        run: |
          pre=""
          case "$TAG" in *-rc.*) pre="--prerelease" ;; esac
          gh release create "$TAG" --title "wraith $TAG" --notes-file notes.md --verify-tag $pre \
            "wraith-$TAG.tar.gz" checksums.txt
